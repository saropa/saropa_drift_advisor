name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please describe what you'd like.
        See [ISSUE_REPORT_GUIDE.md](../../bugs/ISSUE_REPORT_GUIDE.md) for detailed guidance.

  - type: dropdown
    id: type
    attributes:
      label: Request Type
      description: What kind of feature is this?
      options:
        - New diagnostic
        - Quick fix (automated code transformation)
        - UX / extension improvement
        - Tooling / infrastructure
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: |
        What problem does this feature solve? Include concrete examples from
        real usage where this would have caught a bug, improved code quality,
        or saved developer time.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you'd like this to work.
    validations:
      required: true

  - type: textarea
    id: detection
    attributes:
      label: Detection / Behavior (diagnostic proposals only)
      description: |
        For new diagnostics: show code/SQL that SHOULD be flagged (bad) and
        code that should NOT be flagged (good).
      placeholder: |
        ### Should flag (problematic)
        ```sql
        SELECT * FROM large_table;
        ```

        ### Should pass (correct)
        ```sql
        SELECT id, name FROM large_table;
        ```
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the project would this affect?
      options:
        - Dart package (lib/)
        - VS Code extension
        - Web UI (browser)
        - Example app
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or mockups.
    validations:
      required: false
